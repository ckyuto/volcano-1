# Ref https://goreleaser.com

version: 1

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0 # Builds a portable, self-contained, static binary with no external dependencies.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./cmd/scheduler

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_{{- .Os }}_{{ .Tag }}_{{ .Arch }}{{- if .Arm }}v{{ .Arm }}{{ end }}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
