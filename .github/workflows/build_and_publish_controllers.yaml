name: Docker Build and Push Volcano-Admission and Volcano-Controllers

# This workflow is triggered manually on the command line.
# It is used to build the Docker image for Volcano Admission and Controllers and push it to the LinkedIn container image registry.
# Prerequisites:
# Ensure you are on the command line of your local workstation (you must be on BIZ).
# Install the GitHub Actions CLI (brew install act) and Docker.
# Set up a GitHub access token with the repo scope (https://github.com/settings/tokens).
# To publish a new version of the Docker image, run:
# act workflow_dispatch  -j build-controllers --env TAG=<existing_tag_name> GITHUB_TOKEN=<token>


on:
  workflow_dispatch:

jobs:
  build-controllers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ env.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image for Volcano Controller
        run: docker buildx build -t "volcano/vc-controller-manager:${{ env.TAG }}" . --output=type=docker -f installer/dockerfile/controller-manager/Dockerfile --platform="linux/amd64" --no-cache

      - name: Tag Docker image for Volcano Controller
        run: docker tag volcano/vc-controller-manager:${{ env.TAG }} lnkdin.cr/temp/volcano-oss/vc-controller-manager:${{ env.TAG }}

      - name: Push Docker image for Volcano Controller
        run: docker push lnkdin.cr/temp/volcano-oss/vc-controller-manager:${{ env.TAG }}

      - name: Build Docker image for Volcano Admission
        run: docker buildx build -t "volcano/vc-webhook-manager:${{ env.TAG }}" . --output=type=docker -f installer/dockerfile/webhook-manager/Dockerfile --platform="linux/amd64" --no-cache

      - name: Tag Docker image for Volcano Admission
        run: docker tag volcano/vc-webhook-manager:${{ env.TAG }} lnkdin.cr/temp/volcano-oss/vc-webhook-manager:${{ env.TAG }}

      - name: Push Docker image for Volcano Admission
        run: docker push lnkdin.cr/temp/volcano-oss/vc-webhook-manager:${{ env.TAG }}